spring:
  datasource:
    url: jdbc:sqlite:${SQLITE_FILE:./database/qlns.sqlite}?foreign_keys=on&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  sql:
    init:
      mode: never
