# Demo dùng RAM, dữ liệu được khởi tạo lại khi khởi động.
spring:
  datasource:
    url: jdbc:h2:mem:qlns-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql,classpath:db/rental-schema.sql
      data-locations: classpath:db/data.sql

# Cau hinh VietQR de hien thi ma QR thanh toan (MB Bank demo)
QLNS_VIETQR_BANK_BIN: "970422"
QLNS_VIETQR_ACCOUNT_NUMBER: "0387196095"
QLNS_VIETQR_ACCOUNT_NAME: "VUONG NGUYEN TRUONG HUNG"
